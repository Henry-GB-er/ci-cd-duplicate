name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest tests/ -v

      # Step to check if the processed dataset exists
      - name: Check if processed dataset exists
        run: |
          ls -l data/  # This will list the files in the `data/` folder to confirm if `processed_dataset.csv` is created

      # Optional: If processed dataset exists, commit and push it
      - name: Commit and push processed dataset
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/processed_dataset.csv
          git commit -m "Add processed dataset"
          git push origin main
